[package]
name = "gdrive-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/risan/gdrive-client"
publish = false

[dependencies]
md-5 = "0.11"
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
httparse = "1"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
